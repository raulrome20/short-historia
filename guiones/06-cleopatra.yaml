titulo: "Cleopatra está más cerca de nosotros que de las pirámides"
resaltar: [Cleopatra, pirámide, Luna, cerca]

escenas:
  - texto: "Cleopatra vivió más cerca de la llegada a la Luna que de la construcción de la Gran Pirámide."
    imagen: "Cleopatra in royal Egyptian clothing looking up at the Moon with an astronaut floating nearby, surreal epic scene"

  - texto: "La Gran Pirámide de Guiza se construyó hacia el año 2560 antes de Cristo."
    imagen: "thousands of ancient Egyptian workers building the Great Pyramid of Giza, ramps and stone blocks, golden desert light"

  - texto: "Cleopatra murió en el año 30 antes de Cristo. Más de 2500 años después."
    imagen: "Cleopatra standing in front of the already ancient and weathered pyramids, as if they were old ruins to her"

  - texto: "Y el ser humano pisó la Luna en 1969. Unos 2000 años después de Cleopatra."
    imagen: "Apollo astronaut planting a flag on the Moon, Earth in the black sky, cinematic"

  - texto: "Para ella, las pirámides ya eran ruinas antiquísimas, igual que para nosotros."
    imagen: "a timeline drawn on papyrus showing pyramids, Cleopatra and a rocket, with Cleopatra closer to the rocket"

  - texto: "El antiguo Egipto duró tanto que la propia Cleopatra era moderna. Sígueme para más historia."
    imagen: "Cleopatra wearing modern sunglasses taking a selfie in front of the pyramids, funny and stylish"
