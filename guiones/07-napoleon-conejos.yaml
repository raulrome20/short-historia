titulo: "Napoleón contra los conejos"
resaltar: [Napoleón, conejos, huir]

escenas:
  - texto: "Napoleón conquistó media Europa... pero, según cuentan, tuvo que huir de unos conejos."
    imagen: "Napoleon Bonaparte in his famous uniform and bicorne hat running away from a crowd of rabbits, comedic scene"

  - texto: "1807. Tras firmar la paz con Rusia, Napoleón quiere celebrarlo con una cacería de conejos."
    imagen: "Napoleon and his officers in a green meadow in 1807, preparing for a hunt, elegant tents, sunny day"

  - texto: "Su jefe de estado mayor consigue cientos de conejos y los suelta en el campo."
    imagen: "hundreds of rabbits being released from wooden cages in a field, officers watching"

  - texto: "Pero en lugar de huir, los conejos se lanzan en masa hacia Napoleón."
    imagen: "a huge wave of rabbits charging toward a surprised Napoleon, dynamic action shot, funny"

  - texto: "La explicación: eran conejos de granja, y pensaban que les traían comida."
    imagen: "cute farm rabbits surrounding Napoleon's boots, looking up at him hungrily, he looks confused"

  - texto: "El gran emperador acabó retirándose en su carruaje, perseguido por conejos. Sígueme para más historia."
    imagen: "Napoleon escaping in a carriage across a field while rabbits chase it, epic sunset, humorous"
