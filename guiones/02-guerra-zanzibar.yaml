titulo: "La guerra más corta de la historia"
resaltar: [corta, minutos, 38, 45]

escenas:
  - texto: "La guerra más corta de la historia duró menos que un partido de fútbol."
    imagen: "a giant pocket watch floating over a tropical harbor with warships, dramatic sky, epic composition"

  - texto: "27 de agosto de 1896. Zanzíbar, una isla frente a la costa de África."
    imagen: "the island of Zanzibar in 1896, palace by the sea, palm trees, old sailing ships and steamships in the harbor, morning light"

  - texto: "Muere el sultán, y un nuevo sultán toma el poder sin el permiso de los británicos."
    imagen: "a sultan in rich robes sitting confidently on a throne inside an ornate East African palace"

  - texto: "Gran Bretaña le da un ultimátum: o se va antes de las nueve de la mañana, o habrá guerra."
    imagen: "a British naval officer in 1896 uniform pointing at a clock showing almost nine o'clock, warships behind him"

  - texto: "No se fue. Los barcos británicos abrieron fuego... y entre 38 y 45 minutos después, todo había terminado."
    imagen: "Victorian British warships firing at a coastal palace, smoke clouds over the sea, cinematic and dramatic, no gore"

  - texto: "La guerra más corta de la historia. Y encima, Zanzíbar tuvo que pagar los proyectiles. Sígueme para más historia."
    imagen: "a sultan looking shocked at a long bill on a scroll, coins on the table, funny expression"
