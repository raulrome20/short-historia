titulo: "La ola de melaza que arrasó una ciudad"
resaltar: [melaza, ola, Boston, 21]

escenas:
  - texto: "En 1919, una ola gigante de melaza arrasó una ciudad."
    imagen: "a huge brown wave of thick molasses rushing down a 1919 city street, old buildings, dramatic and surreal"

  - texto: "Boston, 15 de enero. Un enorme depósito lleno de melaza revienta de golpe."
    imagen: "a giant steel storage tank bursting open in 1919 Boston harbor district, rivets flying, winter day"

  - texto: "Sale una ola de casi ocho metros de altura, a más de cincuenta kilómetros por hora."
    imagen: "a towering wave of dark molasses taller than the houses, flowing through the North End of Boston, cinematic angle"

  - texto: "Arrastra carros, caballos y hasta derriba parte de un puente elevado del tren."
    imagen: "an elevated railway structure bent by a flood of molasses, old carts stuck in the sticky brown liquid, no people"

  - texto: "Murieron 21 personas. La melaza era tan espesa que los rescatadores apenas podían moverse."
    imagen: "1919 rescuers struggling waist-deep in thick molasses, somber mood, sepia tones"

  - texto: "Dicen que, durante décadas, en los días de calor el barrio todavía olía a melaza. Sígueme para más historia."
    imagen: "a quiet old Boston street on a hot summer day, people sniffing the air with curious faces, warm light"
